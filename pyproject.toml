[project]
name = "llm_support_ticket_routing"
version = "0.1.0"
description = "LLM-powered support ticket routing system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "streamlit>=1.44",
  "plotly>=5.24",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "datasets>=3.1",
  "transformers>=4.46",
  "torch>=2.4",
  "openai>=1.55",
  "python-dotenv>=1.0",
  "kaggle>=1.6",
  "tqdm>=4.67"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
